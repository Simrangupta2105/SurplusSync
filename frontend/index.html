<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurplusSync - Turn Surplus Food into Community Meals</title>
    <meta name="description" content="SurplusSync connects food businesses with verified NGOs to track inventory, identify surplus, and coordinate transparent food redistribution." />
    <meta property="og:title" content="SurplusSync - Turn Surplus Food into Community Meals" />
    <meta property="og:description" content="A unified logistics platform connecting food businesses with verified NGOs to track inventory, identify surplus, and coordinate transparent food redistribution." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SurplusSync" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('surplussync_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            // Default to dark theme as required by design direction
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased selection:bg-[var(--primary)] selection:text-[var(--primary-foreground)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
